<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alia | Login Emprendedores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="layout">
      <section class="ambient" aria-hidden="true">
        <div class="shape shape-a"></div>
        <div class="shape shape-b"></div>
        <div class="shape shape-c"></div>
      </section>

      <section class="login-card" aria-label="Formulario de inicio de sesión">
        <div class="brand-wrap">
          <h1 class="brand">Alia</h1>
        </div>

        <header class="card-header">
          <h2>Empieza Gratis</h2>
          <p>Vende, organiza precios y factura tu taller en un solo lugar.</p>
        </header>

        <form id="login-form" class="login-form" novalidate>
          <label class="field-label" for="email">Correo</label>
          <div class="input-shell">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" role="img" aria-label="">
                <path
                  d="M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5v-9Z"
                  stroke="currentColor"
                  stroke-width="1.7"
                />
                <path
                  d="m5 8 6.24 5.2a1.2 1.2 0 0 0 1.52 0L19 8"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="correo@tunegocio.com"
              autocomplete="email"
              required
            />
          </div>

          <label class="field-label" for="password">Contraseña</label>
          <div class="input-shell">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" role="img" aria-label="">
                <rect
                  x="5"
                  y="10"
                  width="14"
                  height="10"
                  rx="2.2"
                  stroke="currentColor"
                  stroke-width="1.7"
                />
                <path
                  d="M8.5 10V7.7a3.5 3.5 0 1 1 7 0V10"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                />
                <circle cx="12" cy="15" r="1.4" fill="currentColor" />
              </svg>
            </span>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Escribe tu contraseña"
              autocomplete="current-password"
              required
              minlength="8"
            />
            <button
              id="toggle-password"
              class="toggle-password"
              type="button"
              aria-label="Mostrar contraseña"
              title="Mostrar contraseña"
            >
              <svg class="eye eye-open" viewBox="0 0 24 24" fill="none">
                <path
                  d="M2 12s3.7-6 10-6 10 6 10 6-3.7 6-10 6-10-6-10-6Z"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8" />
              </svg>
              <svg class="eye eye-closed" viewBox="0 0 24 24" fill="none">
                <path
                  d="M3 4.5 21 19.5"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
                <path
                  d="M10.5 6.2A11.9 11.9 0 0 1 12 6c6.3 0 10 6 10 6a16.2 16.2 0 0 1-3.3 3.8M7.3 8.2A16 16 0 0 0 2 12s3.7 6 10 6c1 0 2-.2 2.8-.4"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>

          <button class="submit-btn" type="submit">Regístrame</button>

          <p id="form-message" class="message" role="status" aria-live="polite"></p>
        </form>

        <footer class="card-footer">
        </footer>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
